<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Blueprint del nuevo layout del Dashboard Ejecutivo</title>
  <desc>Diagrama mostrando la distribución correcta de secciones en el dashboard</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #3d3d3a; }
      .ts  { font-size: 12px; fill: #73726c; }
      .th  { font-size: 14px; font-weight: 500; fill: #3d3d3a; }
      .label-row { font-size: 12px; fill: #9c9a92; }

      /* Teal */
      .teal rect  { fill: #E1F5EE; stroke: #0F6E56; }
      .teal text  { fill: #085041; }
      /* Blue */
      .blue rect  { fill: #E6F1FB; stroke: #185FA5; }
      .blue text  { fill: #0C447C; }
      /* Amber */
      .amber rect { fill: #FAEEDA; stroke: #854F0B; }
      .amber text { fill: #633806; }
      /* Purple */
      .purple rect { fill: #EEEDFE; stroke: #534AB7; }
      .purple text { fill: #3C3489; }
      /* Coral */
      .coral rect { fill: #FAECE7; stroke: #993C1D; }
      .coral text { fill: #712B13; }
      /* Gray */
      .gray rect  { fill: #F1EFE8; stroke: #5F5E5A; }
      .gray text  { fill: #444441; }
    </style>
  </defs>

  <!-- Row labels -->
  <text class="label-row" x="8" y="50">Row 1</text>
  <text class="label-row" x="8" y="130">Row 2</text>
  <text class="label-row" x="8" y="215">Row 3</text>
  <text class="label-row" x="8" y="315">Row 4</text>
  <text class="label-row" x="8" y="430">Row 5</text>

  <!-- ROW 1: 3 KPIs top (cada uno 1/3) -->
  <g class="teal">
    <rect x="44" y="30" width="192" height="44" rx="6" stroke-width="0.5"/>
    <text class="th" x="140" y="52" text-anchor="middle" dominant-baseline="central">Ocupación Financiera</text>
  </g>
  <g class="teal">
    <rect x="244" y="30" width="192" height="44" rx="6" stroke-width="0.5"/>
    <text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Eficiencia Recaudo</text>
  </g>
  <g class="teal">
    <rect x="444" y="30" width="192" height="44" rx="6" stroke-width="0.5"/>
    <text class="th" x="540" y="52" text-anchor="middle" dominant-baseline="central">Potencial Total</text>
  </g>

  <!-- ROW 2: Evolución 2/3 + Túnel 1/3 -->
  <g class="blue">
    <rect x="44" y="88" width="384" height="88" rx="6" stroke-width="0.5"/>
    <text class="th" x="236" y="126" text-anchor="middle" dominant-baseline="central">Evolución de Recaudo</text>
    <text class="ts" x="236" y="148" text-anchor="middle" dominant-baseline="central">col_span=2 → 2/3 del grid</text>
  </g>
  <g class="amber">
    <rect x="444" y="88" width="192" height="88" rx="6" stroke-width="0.5"/>
    <text class="th" x="540" y="126" text-anchor="middle" dominant-baseline="central">Riesgo Vencimiento</text>
    <text class="ts" x="540" y="148" text-anchor="middle" dominant-baseline="central">col_span=1 → 1/3</text>
  </g>

  <!-- ROW 3: Pulso Operativo full width -->
  <g class="purple">
    <rect x="44" y="190" width="592" height="60" rx="6" stroke-width="0.5"/>
    <text class="th" x="340" y="214" text-anchor="middle" dominant-baseline="central">Pulso Operativo y Acciones — col_span=3 (full width)</text>
    <text class="ts" x="340" y="236" text-anchor="middle" dominant-baseline="central">6 KPI compactos en grid interno 3×2</text>
  </g>

  <!-- ROW 4: Composición + Incidentes + Asesores (3 iguales) -->
  <g class="coral">
    <rect x="44" y="268" width="192" height="80" rx="6" stroke-width="0.5"/>
    <text class="th" x="140" y="300" text-anchor="middle" dominant-baseline="central">Composición</text>
    <text class="ts" x="140" y="318" text-anchor="middle" dominant-baseline="central">Portafolio</text>
  </g>
  <g class="coral">
    <rect x="244" y="268" width="192" height="80" rx="6" stroke-width="0.5"/>
    <text class="th" x="340" y="300" text-anchor="middle" dominant-baseline="central">Incidentes</text>
    <text class="ts" x="340" y="318" text-anchor="middle" dominant-baseline="central">Distribución</text>
  </g>
  <g class="coral">
    <rect x="444" y="268" width="192" height="80" rx="6" stroke-width="0.5"/>
    <text class="th" x="540" y="300" text-anchor="middle" dominant-baseline="central">Top Asesores</text>
    <text class="ts" x="540" y="318" text-anchor="middle" dominant-baseline="central">Revenue</text>
  </g>

  <!-- ROW 5: Vencimientos 50/50 -->
  <g class="gray">
    <rect x="44" y="366" width="290" height="80" rx="6" stroke-width="0.5"/>
    <text class="th" x="189" y="398" text-anchor="middle" dominant-baseline="central">Vencimientos Mandato</text>
    <text class="ts" x="189" y="418" text-anchor="middle" dominant-baseline="central">col_span=1 en grid de 2 cols</text>
  </g>
  <g class="gray">
    <rect x="346" y="366" width="290" height="80" rx="6" stroke-width="0.5"/>
    <text class="th" x="491" y="398" text-anchor="middle" dominant-baseline="central">Vencimientos Arrendamiento</text>
    <text class="ts" x="491" y="418" text-anchor="middle" dominant-baseline="central">col_span=1 en grid de 2 cols</text>
  </g>

  <!-- Footer note -->
  <text class="ts" x="44" y="468" fill="#9c9a92">Grid principal: 3 columnas  •  Tablas: grid 2 columnas separado  •  Ancho 100%</text>
</svg>
