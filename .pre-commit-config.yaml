repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
-   repo: https://github.com/psf/black
    rev: 23.12.0
    hooks:
    -   id: black
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.0
    hooks:
    -   id: ruff

-   repo: local
    hooks:
    -   id: reflex-build-validate
        name: Validate reflex export compiles
        entry: bash -c 'trap "rm -f dummy_build.db" EXIT; DATABASE_URL=sqlite:///dummy_build.db reflex export --frontend-only --no-zip'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
